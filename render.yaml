services:
  - type: web
    name: epyvra-web
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    rootDir: code
    buildCommand: npm ci --include=dev && npm run typecheck && npm run lint && npm run test:security && npm run build
    startCommand: node scripts/migrate-production-settings.mjs && npm start
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: "false"
      - key: MONGODB_URI
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_API_KEY
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_PROJECT_ID
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_APP_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_PATH
        value: /etc/secrets/firebase-service-account.json
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: INSTALL_SETUP_TOKEN
        generateValue: true
      - key: VIDEO_SECRET
        generateValue: true
      - key: PREMIUM_MEDIA_TOKEN_TTL_SECONDS
        value: "300"
      - key: PREMIUM_MEDIA_BIND_IP
        value: "true"
